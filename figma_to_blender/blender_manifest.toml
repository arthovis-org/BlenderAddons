schema_version = "1.0.0"

id = "figma_to_blender"
version = "0.4.0"
name = "Figma to Blender"
tagline = "Import a Figma page or frame as editable 3D UI: linked component instances, 3D presets, re-sync by Figma id"
maintainer = "arthovis-org"
type = "add-on"
website = "https://github.com/arthovis-org/BlenderAddons"
tags = ["Import-Export", "User Interface"]
blender_version_min = "5.0.0"
license = ["SPDX:MIT"]

[permissions]
network = "Fetches page data and rendered SVG/PNG assets from api.figma.com"
files = "Reads and writes scene bundles (scene.json + assets/) chosen by the user"
